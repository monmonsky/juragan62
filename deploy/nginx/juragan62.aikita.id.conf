# Juragan +62 — situs statis (hasil `npm run build`), tanpa PM2/Node.
# Pasang di: /etc/nginx/sites-available/juragan62.aikita.id.conf
#            lalu symlink ke /etc/nginx/sites-enabled/
# Sertifikat: Let's Encrypt via certbot (lihat deploy/README.md).

# HTTP: hanya untuk validasi certbot + redirect ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name juragan62.aikita.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name juragan62.aikita.id;

    root /var/www/juragan62/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/juragan62.aikita.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juragan62.aikita.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Keamanan dasar
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # CSP: izinkan Google Fonts & server sinyal PeerJS (mode online).
    # Kalau nanti pakai server PeerJS/TURN sendiri, tambahkan host-nya di connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; frame-ancestors 'none'; base-uri 'self'" always;

    # Kompresi
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Aset ber-hash dari Vite: cache 1 tahun
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
    }

    # index.html jangan di-cache, supaya versi baru langsung terpakai setelah deploy
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; frame-ancestors 'none'; base-uri 'self'" always;
    }

    # Satu halaman (SPA). Link undangan ?room=KODE tetap ke index.html.
    location / {
        try_files $uri /index.html;
    }
}
